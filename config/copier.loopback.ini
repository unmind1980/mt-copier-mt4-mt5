; ---------------------------------------------------------------------
; copier.loopback.ini - RECEIVER config for the on-machine pilot.
;
; Both terminals run on THIS machine, so everything goes over 127.0.0.1:
; no firewall rule, no VPS, no CURVE, no IP allow-list. That makes this
; the right first end-to-end test - it exercises the whole protocol and
; the whole convergence logic while leaving network security out of the
; picture entirely.
;
; Copy to:  <receiver terminal>\MQL5\Files\copier.ini
; (tools/pilot-setup.sh does this for you)
;
; Sender runs in the OTHER MT5 install with:
;   BindAddress    = 127.0.0.1           <- loopback only, not *
;   EventsPort     = 5555                <- also the sender's IDENTITY, so
;                                            the id below must match it
;   UseCurve       = false
;   SnapshotSeconds= 2
;   LogLevel       = 2                   <- INFO, so opens/closes are visible
;
; The `id` below MUST equal the sender's EventsPort, as a string. There is no
; separate SenderId input any more - the port IS the identity. It is the
; routing key: a receiver ignores every message whose SID it does not
; recognise, silently.
; ---------------------------------------------------------------------

[sender0]
id          = 5555
events      = tcp://127.0.0.1:5555
; snap        = tcp://127.0.0.1:5556   <- OBSOLETE, ignored: one socket carries both streams now

; --- lot sizing. multiplier with 1.0 means "mirror the sender's volume".
;     Change lotparam to 0.1 to watch the sizing path actually do work.
lotmode     = multiplier
lotparam    = 1.0

; --- magic for the mirrored trades. Distinct per sender, and must not
;     collide with anything else running on this account.
magic       = 770000

; --- symbol translation. Both terminals talk to the SAME broker here, so
;     names match and nothing is needed. This is where you would add
;     suffix = m  or  symbol.GOLD = XAUUSD  for a cross-broker setup.
suffix      =
