; ---------------------------------------------------------------------
; copier.mt4to4.ini - RECEIVER config for P2 phase 3: MT4 A <- MT4 B.
;
; Copy to:  <MT4 A terminal>\MQL4\Files\copier.ini
;
; This is the configuration you would actually deploy, and the last
; combination never exercised: order-based on BOTH sides. No trade
; events on either end - both terminals poll OrdersTotal/OrderSelect -
; and MT4's partial close replaces the ticket, which is the thing to
; watch here.
;
; Ports: the MT5 sender from phase 1 owns 5555/5556, so this uses
; 5565/5566. Nothing new is bound on the receiver side either way - a
; receiver only ever connects.
; ---------------------------------------------------------------------

[sender0]
; --- must equal the MT4 B sender EA's EventsPort, as a string ---------
id          = 5565

; --- the MT4 B sender binds these on this machine -------------------
events      = tcp://127.0.0.1:5565
; snap        = tcp://127.0.0.1:5566   <- OBSOLETE, ignored: one socket carries both streams now

; --- lot sizing. Same broker, same demo size -> mirror the volume.
;     Set lotparam = 0.1 if you want to see the sizing path actually
;     convert something rather than pass it through unchanged.
lotmode     = multiplier
lotparam    = 1.0

; --- magic for THIS receiver's own orders on the MT4 A account.
;     Must not collide with other EAs there.
magic       = 770000

; --- symbol translation. Both terminals are the same Alpari feed, so
;     the names match and nothing is needed.
suffix      =
