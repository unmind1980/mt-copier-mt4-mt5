; ---------------------------------------------------------------------
; copier.mt5receiver.2senders.ini - MT5 receiver listening to TWO senders
;
; Copy to:  <MT5 receiver terminal>\MQL5\Files\copier.ini
;           (tools/phase2-setup.sh does this for you)
;
; P2 phase 2: the MT4 terminal becomes a SENDER. This is the only code
; path never exercised - MT4 has no trade events, so the sender polls
; OrdersTotal/OrderSelect on a timer, and a partial close makes the
; broker replace the ticket (the new one carries "from #<old>").
;
; The MT5 sender from phase 1 keeps running, so the receiver ends up
; serving two senders at once. That is the N:M capability by accident,
; and it is worth testing: each sender must keep its own sequence
; counter, its own magic, and its own desired-position set.
;
; PORT NOTE: the MT5 sender already holds 5555/5556 on this machine, so
; the MT4 sender MUST use different ports. Nothing new is bound here -
; the receiver only connects.
; ---------------------------------------------------------------------

; --- the MT5 sender, unchanged from phase 1 -------------------------
[sender0]
id          = 5555
events      = tcp://127.0.0.1:5555
; snap        = tcp://127.0.0.1:5556   <- OBSOLETE, ignored: one socket carries both streams now
lotmode     = multiplier
lotparam    = 1.0
magic       = 770000
suffix      =

; --- the MT4 sender ------------------------------------------------
; `id` MUST equal the MT4 sender EA's EventsPort, as a string - the port IS
; the sender's identity now, there is no separate SenderId input. It is the
; routing key: a receiver ignores any message whose SID it does not
; recognise, silently, so a mismatch looks exactly like "nothing is being
; sent".
[sender1]
id          = 5565
events      = tcp://127.0.0.1:5565
; snap        = tcp://127.0.0.1:5566   <- OBSOLETE, ignored: one socket carries both streams now
lotmode     = multiplier
lotparam    = 1.0

; --- `magic` MUST differ from sender0's. This is what keeps the two
; --- senders' positions apart on the one receiving account: the
; --- receiver finds "its own" orders for a sender by magic, and closes
; --- only what that sender no longer holds.
magic       = 770001
suffix      =
