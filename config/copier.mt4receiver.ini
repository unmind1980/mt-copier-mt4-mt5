; ---------------------------------------------------------------------
; copier.mt4receiver.ini - RECEIVER config for testing an MT4 terminal
;                          against the MT5 sender.
;
; Copy to:  <MT4 terminal>\MQL4\Files\copier.ini
;
; This is the P2 cross-platform test: the MT5 sender stays exactly as it
; is (it is already proven), and an MT4 terminal becomes the receiver.
; That isolates the MT4 EXECUTION path - OrderSend / OrderClose /
; OrderSelect, the order-based model, 31-character comments - which is the
; riskiest code in the project and has never been run.
;
; Ports: the MT5 sender already holds 5555/5556 on this machine, so the
; MT4 side connects to those same ports. Nothing new is bound.
; ---------------------------------------------------------------------

[sender0]
id          = 5555
events      = tcp://127.0.0.1:5555
; snap        = tcp://127.0.0.1:5556   <- OBSOLETE, ignored: one socket carries both streams now

; --- lot sizing. Both sides are demo accounts of similar size, so mirror
;     the volume. Set lotparam = 0.1 if you want to watch the sizing path
;     actually convert something.
lotmode     = multiplier
lotparam    = 1.0

; --- magic for the MT4 receiver's own orders. Must not collide with the
;     user's other EAs on that account - 770000 is well clear of the
;     usual 0..9999 range, but check if you run something unusual.
magic       = 770000

; --- symbol translation. If the MT4 broker is the same Alpari feed, the
;     names match and nothing is needed. If the MT4 account uses a suffix
;     (EURUSD.m, EURUSD#, ...) put it here, or map symbols explicitly:
;         suffix = m
;         symbol.EURUSD = EURUSD.m
suffix      =
