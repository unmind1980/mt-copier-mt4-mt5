<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mt-copier hub</title>
<!--
  ONE FILE, ON PURPOSE.

  No bundler, no npm, no framework, no second origin to get a CORS rule
  wrong for. The hub serves this with include_str!, so the binary is the
  deployment and the page is same-origin with the API it calls - which is
  what the plan's §18 wants and what a reverse proxy would otherwise have
  to be configured for.

  WebSocket first, polling as the fallback. The fallback is not decoration:
  a corporate proxy that eats the upgrade is the normal case, not the exotic
  one, and a dashboard that goes blank there is a dashboard nobody trusts
  again. Three missed WS reconnects and it polls every 5 s instead, saying so
  in the header so the switch is visible rather than mysterious.
-->
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --line:#e3e6ea; --ink:#1c2128;
    --dim:#6a737d; --ok:#1a7f37; --warn:#9a6700; --bad:#c9311c;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);
         padding:12px 20px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  .pill{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:10px;
        border:1px solid var(--line);background:var(--bg);color:var(--dim)}
  .pill.live{color:var(--ok);border-color:#b7ddc2}
  .pill.poll{color:var(--warn);border-color:#e6d29a}
  main{padding:20px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  section h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
             color:var(--dim);padding:10px 14px;border-bottom:1px solid var(--line);
             display:flex;justify-content:space-between;align-items:baseline}
  section h2 span{font-family:var(--mono);text-transform:none;letter-spacing:0}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
  th,td{padding:6px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{padding-right:14px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .online{background:var(--ok)} .stale{background:var(--warn)} .offline{background:var(--bad)}
  .empty{padding:22px 14px;color:var(--dim);font-size:13px;text-align:center}
  #topo svg{display:block;width:100%;height:260px}
  .nd{fill:#eef1f4;stroke:var(--line)}
  .nd.sender{fill:#e8f2fb} .nd.receiver{fill:#f0efe4}
  .edge{stroke:#c3cad1;stroke-width:1.5;fill:none}
  text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
  .lbl{fill:var(--dim);font-size:9.5px}
  footer{padding:0 20px 24px;color:var(--dim);font-size:12px}
  /* M6 alert bar. Hidden when there is nothing to say - an alert that is
     always visible stops being one. */
  #alerts{display:none;padding:0 20px 0}
  #alerts.on{display:block;border-bottom:1px solid var(--line);padding-bottom:8px}
  #alerts .a{font-family:var(--mono);font-size:12px;padding:6px 10px;margin-top:8px;
             border-radius:6px;border:1px solid}
  #alerts .a.crit{background:#fdecea;border-color:#f0b8b0;color:#8a1c10}
  #alerts .a.warn{background:#fff7e0;border-color:#ecd9a0;color:#7a5a00}
  /* M9: the login overlay. The page is one file by design (same-origin, no
     bundler), so the login is part of it: a 401 anywhere raises the overlay,
     a successful login dismisses it and the real page boots. */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
         justify-content:center;z-index:10}
  #login.hidden{display:none}
  /* Generic hide. It had to exist as a RULE of its own: the users panel was
     toggled with classList 'hidden' while only #login.hidden and #pwdlg.hidden
     had rules - so a viewer or operator still saw the panel's frame with
     "loading" inside, which is exactly the kind of half-state that reads as
     a bug (it was). */
  .hidden{display:none !important}
  #login form{background:var(--panel);border:1px solid var(--line);border-radius:8px;
              padding:24px;width:280px;display:flex;flex-direction:column;gap:10px}
  #login h2{margin:0 0 6px;font-size:14px}
  #login input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;
               font:13px/1.4 system-ui,sans-serif;color:var(--ink)}
  #login button{padding:8px;border:1px solid var(--line);border-radius:6px;
                background:var(--bg);cursor:pointer;font:13px system-ui,sans-serif;color:var(--ink)}
  #login button:hover{border-color:#b9c0c8}
  #loginerr{color:var(--bad);font-size:12px;min-height:1em}
  /* The change-password dialog reuses the login form's look, but sits over
     the page rather than replacing it (a scrim, not a takeover). */
  #pwdlg{position:fixed;inset:0;background:rgba(20,24,28,.38);display:flex;
         align-items:center;justify-content:center;z-index:11}
  #pwdlg.hidden{display:none}
  #pwdlg form{background:var(--panel);border:1px solid var(--line);border-radius:8px;
              padding:22px;width:300px;display:flex;flex-direction:column;gap:9px}
  #pwdlg h2{margin:0 0 4px;font-size:14px}
  #pwdlg input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;
               font:13px/1.4 system-ui,sans-serif;color:var(--ink)}
  #pwdlg .row{display:flex;gap:8px}
  #pwdlg button{padding:8px;border:1px solid var(--line);border-radius:6px;flex:1;
                background:var(--bg);cursor:pointer;font:13px system-ui,sans-serif;color:var(--ink)}
  #pwdlg button:hover{border-color:#b9c0c8}
  #pwderr{color:var(--bad);font-size:12px;min-height:1em}
  #pwdok{color:var(--ok);font-size:12px;min-height:1em}
  #adminpwdlg{position:fixed;inset:0;background:rgba(20,24,28,.38);display:flex;
              align-items:center;justify-content:center;z-index:12}
  #adminpwdlg.hidden{display:none}
  #adminpwdlg form{background:var(--panel);border:1px solid var(--line);border-radius:8px;
                   padding:22px;width:320px;display:flex;flex-direction:column;gap:9px}
  #adminpwdlg h2{margin:0 0 4px;font-size:14px}
  #adminpwdlg input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;
                    font:13px/1.4 system-ui,sans-serif;color:var(--ink)}
  #adminpwdlg .row{display:flex;gap:8px}
  #adminpwdlg button{padding:8px;border:1px solid var(--line);border-radius:6px;flex:1;
                     background:var(--bg);cursor:pointer;font:13px system-ui,sans-serif;color:var(--ink)}
  #adminpwdlg button:disabled{opacity:.55;cursor:wait}
  #adminpwerr{color:var(--bad);font-size:12px;min-height:1em;overflow-wrap:anywhere}
  #adminpwok{color:var(--ok);font-size:12px;min-height:1em}
  /* --- M9 user management ------------------------------------------- */
  #users-sec form{display:flex;gap:8px;align-items:center;margin-top:8px;
                  flex-wrap:wrap}
  #users-sec input,#users-sec select{padding:7px 9px;border:1px solid var(--line);
               border-radius:6px;font:13px/1.4 system-ui,sans-serif;color:var(--ink)}
  #users-sec button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;
                background:var(--bg);cursor:pointer;font:13px system-ui,sans-serif;
                color:var(--ink)}
  #users-sec button:hover{border-color:#b9c0c8}
  #users-sec td button{padding:3px 8px;font-size:12px}
  #uerr{color:var(--bad);font-size:12px}
  #uok{color:var(--ok);font-size:12px}
  #usersbody td .ops{white-space:nowrap}
  /* M5b: a node's own report that the hub has it paused. A chip, not a
     liveness change - the node is online and healthy, it just will not open
     new mirrors until the hub says resume. */
  .pzchip{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
          font-weight:600;letter-spacing:.4px;background:#fff3cd;
          border:1px solid #e6d28a;color:#7a5a00;vertical-align:1px}
  /* The hub's CURVE public key: public by definition, shown where it can be
     copied (it is what every node's HubPublicKey input needs). */
  #curvekey{color:var(--ink)}
  #curvekey code{font-family:ui-monospace,Consolas,monospace;font-size:11px;
                 color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--dim)}
  .ops{white-space:nowrap}
  .opbtn{font:11px/1 var(--mono);padding:3px 6px;margin:0 2px 2px 0;border:1px solid var(--line);
         background:var(--bg);color:var(--ink);border-radius:5px;cursor:pointer}
  .opbtn:hover{border-color:#b9c0c8}
  .opbtn:disabled{opacity:.5;cursor:default}
  .opbtn.danger{color:var(--bad);border-color:#e8b4ab}
  .opbtn.danger:hover{border-color:var(--bad)}
  .opmsg{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);
         margin-top:2px;min-height:1em;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opmsg.ok{color:var(--ok)} .opmsg.warn{color:var(--warn)} .opmsg.bad{color:var(--bad)}
  /* A sender holding many different symbols filled the symbols cell with one
     long run of "SYM x n/lots" and stretched the whole table past the panel.
     Every other cell stays nowrap (numbers and ids read badly broken); this
     one cell is a LIST, so let it wrap like one. */
  #pos td.sy{white-space:normal}
</style>
</head>
<body>
<header>
  <h1>mt-copier hub</h1>
  <span class="pill" id="mode">connecting</span>
  <span class="pill" id="who"></span>
  <span class="pill" id="counts">-</span>
  <span class="pill" id="up">-</span>
  <span class="pill" id="age">-</span>
</header>
<div id="alerts"></div>

<main>
  <section id="globalops" style="grid-column:1/-1">
    <h2>Global operations <span id="gstate"></span></h2>
    <div style="padding:10px 14px">
      <button class="opbtn" data-gop="pause">pause ALL receivers</button>
      <button class="opbtn" data-gop="resume">resume ALL receivers</button>
      <button class="opbtn danger" data-gop="closeall">CLOSE ALL (every receiver, every mirror)</button>
      <span class="opmsg" id="gmsg"></span>
    </div>
  </section>

  <section>
    <h2>Nodes <span id="ncount"></span></h2>
    <div id="nodes"><div class="empty">loading</div></div>
  </section>

  <section>
    <h2>Positions <span id="pcount"></span></h2>
    <div id="pos"><div class="empty">loading</div></div>
  </section>

  <section id="topo" style="grid-column:1/-1">
    <h2>Topology <span id="tcount"></span></h2>
    <div id="topobody"><div class="empty">loading</div></div>
  </section>

  <!-- M9: user management. Rendered ONLY for an admin (a 403 on the users
       endpoint hides it) - the server is the gate, this is just the chrome. -->
  <section id="users-sec" class="hidden" style="grid-column:1/-1">
    <h2>Users <span id="ucount"></span></h2>
    <div id="usersbody"><div class="empty">loading</div></div>
    <form id="userform">
      <input id="uid" placeholder="user id" autocapitalize="off" style="flex:0 0 160px">
      <input id="upass" type="password" placeholder="password (min 8 chars)" style="flex:0 0 200px">
      <select id="urole" style="flex:0 0 120px">
        <option value="viewer">viewer</option>
        <option value="operator">operator</option>
        <option value="admin">admin</option>
      </select>
      <button type="submit">add / update</button>
      <span id="uerr"></span><span id="uok"></span>
    </form>
  </section>
</main>

<footer id="foot"><span id="writes-state">loading command state…</span> · <span id="curvekey" class="hidden">CURVE <code id="ckey" title="click to copy"></code> <a href="#" id="ckeycopy" style="color:inherit">(copy)</a></span> · <a href="#" id="pwdlink" style="color:inherit">(change password)</a> · <a href="#" id="logout" style="color:inherit">(log out)</a></footer>

<div id="pwdlg" class="hidden">
  <form id="pwdform">
    <h2>change your password</h2>
    <input id="pwdold" type="password" placeholder="current password" autocomplete="current-password">
    <input id="pwdnew" type="password" placeholder="new password (at least 8 characters)" autocomplete="new-password">
    <input id="pwdnew2" type="password" placeholder="repeat the new password" autocomplete="new-password">
    <div class="row">
      <button type="submit">change</button>
      <button type="button" id="pwdcancel">cancel</button>
    </div>
    <div id="pwderr"></div>
    <div id="pwdok"></div>
  </form>
</div>

<div id="adminpwdlg" class="hidden" role="dialog" aria-modal="true" aria-labelledby="adminpwtitle">
  <form id="adminpwform">
    <h2 id="adminpwtitle">reset user password</h2>
    <input id="adminpw1" type="password" placeholder="new password (at least 8 characters)" autocomplete="new-password">
    <input id="adminpw2" type="password" placeholder="repeat new password" autocomplete="new-password">
    <div class="row">
      <button id="adminpwsave" type="submit">set password</button>
      <button type="button" id="adminpwc">cancel</button>
    </div>
    <div id="adminpwerr" role="alert" aria-live="polite"></div>
    <div id="adminpwok" role="status" aria-live="polite"></div>
  </form>
</div>

<div id="login" class="hidden">
  <form id="loginform">
    <h2>mt-copier hub — sign in</h2>
    <input id="user" placeholder="user id" autocomplete="username" autocapitalize="off">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button type="submit">sign in</button>
    <div id="loginerr"></div>
  </form>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- state
var s = { data:null, mode:"ws", misses:0, lastAt:0, poller:null, writes:false,
          users:{ rows:[] },
          // What the two tables currently show. Compared rather than
          // assumed, so a change of SET rebuilds and a change of VALUES
          // does not - see renderNodes/renderPositions.
          nodeKeys:null, nodeRows:null, posKeys:null, posRows:null };

function $(id){ return document.getElementById(id); }
function esc(x){
  return String(x).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtAge(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 60) return sec + "s ago";
  if(sec < 3600) return Math.floor(sec/60) + "m ago";
  return Math.floor(sec/3600) + "h ago";
}

// ---------------------------------------------------------------- fetch
function api(path, opts){
  return fetch(path, opts).then(function(r){
    if(!r.ok) throw new Error(path + " -> " + r.status);
    return r.json();
  });
}

// ---------------------------------------------------------------- order
// Sorted HERE as well as on the server, and that is not redundancy.
//
// The server now sends one order (see nodes_json_list / positions_json_list in
// hub/src/api.rs - the bug was that REST sorted by account while the WebSocket
// pushed sorted by last_seen, so every heartbeat reshuffled the table). But a
// page that depends on somebody remembering to sort a future endpoint is a
// page that will reshuffle again. So the order that the user sees is decided
// in one place: here.
//
// Plain < / > rather than localeCompare: the server compares bytes, and these
// are account numbers and node keys. A locale-ware comparison could disagree
// with it, which would reintroduce exactly the flicker being fixed.
function cmp(a, b){
  a = (a === undefined || a === null) ? "" : String(a);
  b = (b === undefined || b === null) ? "" : String(b);
  return a < b ? -1 : (a > b ? 1 : 0);
}
function sortNodes(n){ return n.slice().sort(function(x, y){ return cmp(x.key, y.key); }); }
function sortPos(n){ return n.slice().sort(function(x, y){ return cmp(x.sid, y.sid); }); }

// ---------------------------------------------------------------- text
// The STATE cell, in one function, because it used to be inline and it used to
// go BLANK.
//
// `n.quiet_secs > 0 ? " · quiet " + fmtAge(...) : ""` dropped the entire suffix
// whenever the value was zero, and the server quantises quiet_secs to a
// multiple of 0.1 - so a heartbeat that had just landed produced exactly 0.0,
// the suffix vanished, and one second later "quiet 0s ago" was back. Reported
// off the screenshot as "a moment of complete blank".
//
// The suffix is unconditional now. It may say "quiet 0s ago" - that is honest,
// and a number that ticks 1 -> 0 -> 1 is readable, whereas text that appears
// and disappears is not.
function stateText(n){
  var q = Math.max(0, Math.round(n.quiet_secs || 0));
  return n.liveness + " \u00b7 quiet " + q + "s ago";
}

// ---------------------------------------------------------------- render
function render(){
  var d = s.data;
  if(!d){ return; }
  var nodes = sortNodes(d.nodes || []);
  var pos = sortPos(d.positions || []);
  var counts = {online:0,stale:0,offline:0};
  nodes.forEach(function(n){ if(counts[n.liveness] !== undefined) counts[n.liveness]++; });
  $("counts").textContent =
    counts.online + " online / " + counts.stale + " stale / " + counts.offline + " offline";
  $("up").textContent = "up " + fmtAge(d.hub_uptime_secs);
  $("age").textContent = "updated " + (s.lastAt ? fmtAge((Date.now()-s.lastAt)/1000) : "-");
  $("ncount").textContent = nodes.length + " node(s)";
  $("pcount").textContent = pos.length + " sender(s)";

  renderAlerts(d.alerts || []);
  renderNodes(nodes);
  renderPositions(pos);
  drawTopology(nodes);
  renderCurveKey(d.curve || null);
}

// M9/§19.1: the hub's CURVE public key lives in the footer, because it is
// the one value every node's HubPublicKey input needs and it is PUBLIC by
// definition (the log prints it at every start; this is the same string).
function renderCurveKey(cv){
  var box = $("curvekey");
  if(!cv || !cv.on || !cv.public_key){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  var code = $("ckey");
  if(code.textContent !== cv.public_key){ code.textContent = cv.public_key; }
  var note = cv.learn ? " (learn mode: new keys are added to curve_clients.txt automatically)" : "";
  box.setAttribute("title", "CURVE public key - what every node's HubPublicKey input holds." + note);
}

//--- M6: the alert bar. The hub's WebSocket (and the polling fallback) put
//--- the engine's recent ring in every snapshot, so this is a pure render.
//--- Hidden when empty: an alert that is always visible stops being one.
function renderAlerts(alerts){
  var bar = $("alerts");
  if(!alerts || !alerts.length){
    bar.className = "";
    bar.innerHTML = "";
    return;
  }
  bar.className = "on";
  // Newest first, capped at five; the rest live on /api/v1/alerts.
  bar.innerHTML = alerts.slice(0, 5).map(function(a){
    var when = a.ts ? new Date(a.ts * 1000).toLocaleTimeString() : "";
    return '<div class="a ' + (a.severity === "critical" ? "crit" : "warn") + '">' +
           esc(when) + " · " + esc(a.kind) + " · " + esc(a.node || "-") +
           " · " + esc(JSON.stringify(a.detail)) + "</div>";
  }).join("");
}

// --- NODES ---------------------------------------------------------------
//
// Rebuilt only when the SET of keys changes. In between, the cells are
// updated in place. That matters more than it sounds: `innerHTML` on a table
// destroys and recreates every node every second, and a DOM that is being
// rebuilt while you read it flickers even when the text is identical.
//
// The state cell is the one that changes on its own (quiet_secs ticks), so it
// is the one that made the rebuild-per-second visible.
function renderNodes(nodes){
  var host = $("nodes");
  if(!nodes.length){
    host.innerHTML = '<div class="empty">no node has registered yet</div>';
    s.nodeKeys = null; s.nodeRows = null;
    return;
  }
  var keys = nodes.map(function(n){ return n.key; }).join("\u0000");
  if(keys !== s.nodeKeys){
    var rows = nodes.map(function(n){
      // Operational commands (M5a) target a RECEIVER only - the hub refuses
      // them for a sender. So the buttons appear for receivers and a dash for
      // senders, keeping the column aligned and the semantics honest.
      var ops = (n.role === "receiver")
        ? "<button class='opbtn' data-op='pause'>pause</button>" +
          "<button class='opbtn' data-op='resume'>resume</button>" +
          "<button class='opbtn danger' data-op='closeall'>close all</button>" +
          "<button class='opbtn' data-op='reload'>reload</button>" +
          "<span class='opmsg'></span>"
        : "<span class='opmsg'>-</span>";
      return "<tr data-k=\"" + esc(n.key) + "\">" +
             "<td><span class='dot'></span><span class='k'></span></td>" +
             "<td class='nm'><span class='nmv'></span> <span class='pzchip' style='display:none'" +
             " title='hub pause: no new mirrors until the hub sends resume'>PAUSED</span></td>" +
             "<td class='num ps'></td>" +
             "<td class='st'></td>" +
             "<td class='ops'>" + ops + "</td></tr>";
    }).join("");
    host.innerHTML =
      "<table><thead><tr><th>node</th><th>name</th><th class=\"num\">pos</th>" +
      "<th>state</th><th>ops</th></tr></thead><tbody>" + rows + "</tbody></table>";
    s.nodeKeys = keys;
    s.nodeRows = {};
    var trs = host.getElementsByTagName("tr");
    for(var i = 0; i < trs.length; i++){
      var k = trs[i].getAttribute("data-k");
      if(!k) continue;
      s.nodeRows[k] = {
        dot: trs[i].getElementsByClassName("dot")[0],
        k:   trs[i].getElementsByClassName("k")[0],
        nm:  trs[i].getElementsByClassName("nmv")[0],
        pz:  trs[i].getElementsByClassName("pzchip")[0],
        ps:  trs[i].getElementsByClassName("ps")[0],
        st:  trs[i].getElementsByClassName("st")[0]
      };
    }
  }
  nodes.forEach(function(n){
    var r = s.nodeRows[n.key];
    if(!r) return;
    r.dot.className = "dot " + n.liveness;
    r.k.textContent = n.key;
    r.nm.textContent = n.name || "-";
    // M5b: the node's own hub-pause report. A chip rather than a state change:
    // the node is online and healthy, it is just not opening new mirrors.
    if(r.pz){ r.pz.style.display = n.paused ? "" : "none"; }
    // The receiver reports orphan-tagged positions separately; they are not
    // in its managed HELD count. Show both figures without conflating them.
    if(n.positions && n.positions.count !== undefined){
      var orphaned = n.positions.orphaned;
      r.ps.textContent = n.positions.count +
        (typeof orphaned === "number" ? " (+" + orphaned + " orphan)" : " (+? orphan)");
      r.ps.title = typeof orphaned === "number"
        ? "Managed positions; " + orphaned + " orphaned copier position(s)"
        : "Managed positions; orphan count not reported by this receiver";
    } else {
      r.ps.textContent = "-";
      r.ps.title = "Position count not reported yet";
    }
    r.st.textContent = stateText(n);
  });
}

// --- POSITIONS -----------------------------------------------------------
//
// Same shape, and for the same reason. The lot counts and the receipt hash
// change on every snapshot, so this table was being destroyed and rebuilt a
// few times a second.
function renderPositions(pos){
  var host = $("pos");
  if(!pos.length){
    host.innerHTML = '<div class="empty">no snapshot received yet</div>';
    s.posKeys = null; s.posRows = null;
    return;
  }
  var keys = pos.map(function(p){ return p.sid; }).join("\u0000");
  if(keys !== s.posKeys){
    var rows = pos.map(function(p){
      return "<tr data-s=\"" + esc(p.sid) + "\">" +
             "<td class='sd'></td>" +
             "<td class='num c'></td>" +
             "<td class='num l'></td>" +
             "<td class='sy'></td>" +
             "<td class='h'></td></tr>";
    }).join("");
    host.innerHTML =
      "<table><thead><tr><th>sender</th><th class=\"num\">pos</th>" +
      "<th class=\"num\">lots</th><th>symbols</th><th>H</th></tr></thead><tbody>" +
      rows + "</tbody></table>";
    s.posKeys = keys;
    s.posRows = {};
    var trs = host.getElementsByTagName("tr");
    for(var i = 0; i < trs.length; i++){
      var sid = trs[i].getAttribute("data-s");
      if(!sid) continue;
      s.posRows[sid] = {
        sd: trs[i].getElementsByClassName("sd")[0],
        c:  trs[i].getElementsByClassName("c")[0],
        l:  trs[i].getElementsByClassName("l")[0],
        sy: trs[i].getElementsByClassName("sy")[0],
        h:  trs[i].getElementsByClassName("h")[0]
      };
    }
  }
  pos.forEach(function(p){
    var r = s.posRows[p.sid];
    if(!r) return;
    var syms = (p.symbols || []).map(function(x){
      return esc(x.symbol) + "×" + esc(x.count) + "/" + esc(x.lots);
    }).join(" ");
    r.sd.textContent = p.sid;
    r.c.textContent = p.count;
    r.l.textContent = p.lots;
    r.sy.textContent = syms || "-";
    r.h.textContent = p.receipt || "-";
  });
}

function drawTopology(nodes){
  var senders = nodes.filter(function(n){ return n.role === "sender"; });
  var receivers = nodes.filter(function(n){ return n.role === "receiver"; });
  $("tcount").textContent = senders.length + " sender(s) · " + receivers.length + " receiver(s)";
  if(!nodes.length){
    $("topobody").innerHTML = '<div class="empty">nothing to draw yet</div>';
    return;
  }
  // A hub in the middle, senders left, receivers right. Not a graph layout:
  // the shape IS the topology, so it never has to be computed.
  // The gap. The labels used to sit at the box EDGE (x +- 72, and the box is
  // 144 wide), so a name and its account-number box rendered as one smeared
  // block - reported as "像素块连起来". Everything below is in units of that
  // one number: BOX_W/2 is the box half-width, LBL_GAP the clear space between
  // the box and the text, and the columns are pushed out far enough that the
  // longest name still has room rather than being clipped by the viewBox.
  var BOX_W = 148, BOX_HALF = BOX_W / 2, LBL_GAP = 16, TEXT_W = 96;
  var W = BOX_HALF * 2 + LBL_GAP + TEXT_W * 2 + 340;
  var H = 60 + Math.max(senders.length, receivers.length, 1) * 46;
  var cx = W / 2;
  var cols = { s: { x: TEXT_W + BOX_HALF }, r: { x: W - TEXT_W - BOX_HALF } };
  function slot(i){ return { y: 40 + i*46 }; }
  var out = ['<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">'];
  var hub = { x: cx, y: H/2 };
  senders.forEach(function(n,i){
    var p = slot(i);
    out.push('<path class="edge" d="M' + cols.s.x + ' ' + p.y + ' L' + hub.x + ' ' + hub.y + '"/>');
  });
  receivers.forEach(function(n,i){
    var p = slot(i);
    out.push('<path class="edge" d="M' + hub.x + ' ' + hub.y + ' L' + cols.r.x + ' ' + p.y + '"/>');
  });
  out.push('<rect class="nd" x="' + (hub.x-34) + '" y="' + (hub.y-13) +
           '" width="68" height="26" rx="5"/>');
  out.push('<text x="' + hub.x + '" y="' + (hub.y+4) + '" text-anchor="middle">hub</text>');
  senders.forEach(function(n,i){
    var p = slot(i);
    out.push(box(cols.s.x, p.y, "nd sender", esc(n.acc)));
    out.push('<text class="lbl" x="' + (cols.s.x - BOX_HALF - LBL_GAP) + '" y="' + (p.y+4) + '" text-anchor="end">' +
             esc(n.name || "sender") + '</text>');
  });
  receivers.forEach(function(n,i){
    var p = slot(i);
    out.push(box(cols.r.x, p.y, "nd receiver", esc(n.acc)));
    out.push('<text class="lbl" x="' + (cols.r.x + BOX_HALF + LBL_GAP) + '" y="' + (p.y+4) + '">' +
             esc(n.name || "receiver") + '</text>');
  });
  out.push('</svg>');
  $("topobody").innerHTML = out.join("");
  function box(x,y,cls,label){
    return '<rect class="' + cls + '" x="' + (x - BOX_HALF) + '" y="' + (y - 13) +
           '" width="' + BOX_W + '" height="26" rx="5"/><text x="' + x + '" y="' + (y + 4) +
           '" text-anchor="middle">' + label + '</text>';
  }
}

// ---------------------------------------------------------------- data paths
function accept(payload){
  s.data = payload;
  s.lastAt = Date.now();
  s.misses = 0;
  render();
}

// The initial / fallback fetch. It fetches /api/v1/topology, which answers
// {senders, receivers, edges, counts} - and render() reads {nodes, positions}.
//
// That mismatch was a real bug, not a cosmetic one: with the WebSocket down
// and polling as the fallback, the NODES table rendered EMPTY, because the
// payload it was handed had no `nodes` key at all. It only ever looked fine
// because the WebSocket path - which sends exactly {nodes, positions} - was
// the one normally in use.
//
// So the shape is converted here, once, rather than making render() know
// about two payload shapes.
function refresh(){
  api("/api/v1/topology").then(function(t){
    accept({
      nodes: (t.senders || []).concat(t.receivers || []),
      positions: [],
      hub_uptime_secs: (t.counts || {}).hub_uptime_secs || 0,
      alerts: t.alerts || [],
      curve: t.curve || null
    });
  }).catch(function(){
    // A 401 here means the session died between heartbeats - go back to the
    // login overlay rather than spinning on a page that can never fill.
    showLogin();
  });
}

function startPolling(){
  if(s.poller) return;
  s.mode = "poll";
  $("mode").textContent = "polling";
  $("mode").className = "pill poll";
  s.poller = setInterval(refresh, 5000);
  refresh();
}

function startWS(){
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  var ws = new WebSocket(proto + "//" + location.host + "/api/v1/stream");
  ws.onopen = function(){
    s.mode = "ws"; s.misses = 0;
    $("mode").textContent = "live";
    $("mode").className = "pill live";
    if(s.poller){ clearInterval(s.poller); s.poller = null; }
  };
  ws.onmessage = function(ev){
    try { var m = JSON.parse(ev.data); } catch(e){ return; }
    if(m.t === "snapshot"){
      accept({ nodes:m.data.nodes || [], positions:m.data.positions || [],
               hub_uptime_secs:m.data.hub_uptime_secs || 0,
               alerts:m.data.alerts || [],
               curve:m.data.curve || null });
    }
  };
  ws.onclose = function(){
    s.misses++;
    if(s.misses >= 3){ startPolling(); return; }
    $("mode").textContent = "reconnecting";
    setTimeout(startWS, 800);
  };
  ws.onerror = function(){ /* onclose follows */ };
}

// ---------------------------------------------------------------- commands (M5a)
// Issue an operational command to a node via POST /api/v1/nodes/{id}/commands.
// The hub (M5a) accepts it, puts it on the retry ladder and returns a
// command_id; the EA only acts on it once M5b lands. A click therefore proves
// the hub half works even before the EA executes anything.
//
// Feedback is written into the .opmsg span of the same row. renderNodes never
// overwrites that span (it only updates dot/k/nm/ps/st), so a status survives
// the once-per-second re-render until the row SET itself changes.
function sendCommand(k, op, msgEl){
  if(msgEl){ msgEl.className = "opmsg"; msgEl.textContent = "issuing " + op + "…"; }
  var url = "/api/v1/nodes/" + encodeURIComponent(k) + "/commands";
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ op: op })
  }).then(function(r){
    return r.json().then(function(j){ return { status: r.status, j: j }; });
  }).then(function(res){
    if(!msgEl) return;
    if(res.j && res.j.error){
      msgEl.className = "opmsg bad";
      var extra = res.j.detail
        ? " — " + res.j.detail
        : (res.j.known ? " (known: " + res.j.known.join(", ") + ")" : "");
      msgEl.textContent = res.j.error + extra;
    } else if(res.j && (res.j.command_id || res.j.id)){
      //--- The 202 body names it `command_id` (`id` is the audit record's
      //--- field); both are accepted so this can never degrade to a bare
      //--- status code again - which is exactly what it did show, because
      //--- the first cut read `id` and fell through to the fallback.
      var cid = res.j.command_id || res.j.id;
      msgEl.className = "opmsg ok";
      msgEl.textContent = "issued " + cid + " · " + (res.j.state || "?");
      pollCommand(res.j.poll, cid, msgEl, 0);
    } else {
      msgEl.className = "opmsg warn";
      msgEl.textContent = "HTTP " + res.status;
    }
  }).catch(function(e){
    if(msgEl){ msgEl.className = "opmsg bad"; msgEl.textContent = "request failed: " + e.message; }
  });
}

//--- The 202 only means the hub TOOK the command. Whether the receiver
//--- answered is visible only in the command's state, so follow the poll
//--- URL: once at 2.5 s (a live receiver ACKs in milliseconds - the ladder's
//--- first retry is at 2 s, so 2.5 s separates "answered" from "retrying"
//--- cleanly), and once more at 10 s before settling on whatever it says.
//--- A receiver running the OLD build, or with AcceptCommands=false, shows
//--- up here as rejected (it answers OK=0) or as pending climbing to
//--- unknown - which is the honest picture of "the node did not obey".
function pollCommand(poll, cid, msgEl, attempt){
  if(!poll || !msgEl) return;
  setTimeout(function(){
    api(poll).then(function(j){
      if(!j || !j.state) return;
      if(j.state === "pending" && attempt < 1){
        pollCommand(poll, cid, msgEl, attempt + 1);
        return;
      }
      if(j.state === "acked"){
        msgEl.className = "opmsg ok";
        msgEl.textContent = cid + " · acked by the node";
      } else if(j.state === "rejected"){
        msgEl.className = "opmsg bad";
        msgEl.textContent = cid + " · rejected: " + (j.err || "no reason given");
      } else {
        msgEl.className = "opmsg warn";
        msgEl.textContent = cid + " · " + j.state + (j.err ? " (" + j.err + ")" : "");
      }
    }).catch(function(){ /* the row may have been rebuilt; nothing to say */ });
  }, attempt === 0 ? 2500 : 10000);
}

// One delegated listener on #nodes survives the table's innerHTML rebuilds, so
// handlers never have to be re-bound when the row SET changes.
function onOpClick(ev){
  var t = ev.target, btn = null;
  while(t && t.parentNode && t !== this){
    if(t.classList && t.classList.contains("opbtn")){ btn = t; break; }
    t = t.parentNode;
  }
  if(!btn) return;
  var td = btn.parentNode;
  var k = td.parentNode.getAttribute("data-k");
  var op = btn.getAttribute("data-op");
  var msg = td.querySelector ? td.querySelector(".opmsg") : null;
  sendCommand(k, op, msg);
}

// G10: one call, every receiver. The hub mints ONE COMMAND PER RECEIVER (a
// broadcast frame would be one id shared by N nodes - see api.rs), so the
// feedback lists every command_id. closeall asks first: it queues a close
// for every mirrored position the copier holds.
function sendGlobal(op){
  var msgEl = $("gmsg");
  if(op === "closeall" &&
     !window.confirm("CLOSE ALL queues a close for EVERY mirrored position on EVERY receiver. Continue?"))
    return;
  if(msgEl){ msgEl.className = "opmsg"; msgEl.textContent = "issuing global " + op + "…"; }
  fetch("/api/v1/commands", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ op: op })
  }).then(function(r){
    return r.json().then(function(j){ return { status: r.status, j: j }; });
  }).then(function(res){
    if(!msgEl) return;
    if(res.j && res.j.error){
      msgEl.className = "opmsg bad";
      msgEl.textContent = res.j.error + (res.j.detail ? " — " + res.j.detail : "");
      return;
    }
    var ids = (res.j.issued || []).map(function(x){ return x.command_id; }).join(", ");
    msgEl.className = "opmsg ok";
    msgEl.textContent = "global " + op + ": " + (res.j.count || 0) + " command(s) issued"
      + (ids ? " — " + ids : "");
  }).catch(function(e){
    if(msgEl){ msgEl.className = "opmsg bad"; msgEl.textContent = "request failed: " + e.message; }
  });
}

// One delegated listener on #globalops, same pattern as the per-row one.
function onGlobalClick(ev){
  var t = ev.target, btn = null;
  while(t && t.parentNode && t !== this){
    if(t.classList && t.classList.contains("opbtn") && t.getAttribute("data-gop")){ btn = t; break; }
    t = t.parentNode;
  }
  if(btn) sendGlobal(btn.getAttribute("data-gop"));
}

// Reflect whether this hub allows writes (--writes on). The flag is a startup
// setting, so one check at boot is enough; it also drives the footer note.
function refreshWritesState(){
  api("/api/v1/commands").then(function(j){
    s.writes = !!j.writes_enabled;
    var f = $("writes-state");
    if(!f) return;
    if(!s.writes){
      f.textContent = "commands are OFF: this hub started with --writes off (the default). " +
        "Restart with --writes on to issue operational commands (pause / resume / close-all / reload).";
    } else {
      f.textContent = "operational commands target receivers; the EA acts on them once M5b lands. " +
        "Each click issues a command via the M5a hub endpoint and shows its command_id.";
    }
  }).catch(function(){
    var f = $("writes-state");
    if(f) f.textContent = "could not read command state from the hub.";
  });
}

//--- M9: identity first, dashboard second. whoami answers with the session
//--- cookie the browser already holds; a 401 is not an error, it is the
//--- invitation to the overlay. Every later 401 (an expired session, say)
//--- comes back here through api()'s rejection path.
function showLogin(){
  $("login").classList.remove("hidden");
  $("loginerr").textContent = "";
}
function startDashboard(){
  refresh();
  if(window.WebSocket){ startWS(); } else { startPolling(); }
  setInterval(function(){ if(s.lastAt) render(); }, 1000); // keeps "age" honest
  $("nodes").addEventListener("click", onOpClick);
  $("globalops").addEventListener("click", onGlobalClick);
  refreshWritesState();
}

// --- M9 user management (admin only) ---------------------------------
// The SERVER is the gate (every /users endpoint 403s a non-admin); the UI
// merely hides the section when the caller is not one, so a viewer never
// sees controls that cannot work. loadUsers() asks the server, not the
// snapshot: users are not part of the per-second state.
function loadUsers(){
  api("/api/v1/users").then(function(j){
    $("users-sec").classList.remove("hidden");
    renderUsers(j.users || []);
  }).catch(function(){
    // 403 = a viewer or operator looking at an admin panel. Hidden, and
    // that is the gate working - not an error to report.
    $("users-sec").classList.add("hidden");
  });
}
function renderUsers(users){
  s.users.rows = users;
  $("ucount").textContent = users.length + " user(s)";
  $("usersbody").innerHTML =
    "<table><thead><tr><th>user</th><th>role</th><th>state</th><th></th></tr></thead><tbody>" +
    users.map(function(u){
      return "<tr data-u='" + esc(u.id) + "'>" +
             "<td class='k'>" + esc(u.id) + "</td>" +
             "<td>" + esc(u.role) + "</td>" +
             "<td>" + (u.disabled ? "disabled" : "active") + "</td>" +
             "<td class='ops'><button data-act='pwd'>password</button> " +
             "<button data-act='toggle'>" + (u.disabled ? "enable" : "disable") +
             "</button> <button data-act='del'>delete</button></td></tr>";
    }).join("") +
    "</tbody></table>" +
    "<p style='color:var(--dim);font-size:12px;margin:6px 0 0'>add / update needs a password;" +
    " disable, enable and role changes keep the existing one. The last admin cannot be" +
    " deleted, demoted or disabled.</p>";
}
function openAdminPasswordReset(user){
  adminPasswordTarget = user.id;
  $("adminpwtitle").textContent = "Set password for " + user.id;
  $("adminpw1").value = $("adminpw2").value = "";
  $("adminpwerr").textContent = $("adminpwok").textContent = "";
  $("adminpwsave").disabled = false;
  $("adminpwc").disabled = false;
  $("adminpwdlg").classList.remove("hidden");
  $("adminpw1").focus();
}
function closeAdminPasswordReset(){
  $("adminpwdlg").classList.add("hidden");
  adminPasswordTarget = "";
  $("adminpw1").value = $("adminpw2").value = "";
  $("adminpwerr").textContent = $("adminpwok").textContent = "";
}
var adminPasswordTarget = "";
function userAction(act, id, ev){
  ev.preventDefault();
  $("uerr").textContent = ""; $("uok").textContent = "";
  var u = s.users.rows.filter(function(x){ return x.id === id; })[0];
  if(act === "del"){
    if(!confirm("Delete user " + id + "?")) return;
    api("/api/v1/users/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function(){ loadUsers(); })
      .catch(function(e){ $("uerr").textContent = "delete failed: " + e.message; });
  } else if(act === "pwd" && u){
    openAdminPasswordReset(u);
  } else if(act === "toggle" && u){
    // Empty password = keep the existing credential (the API refuses a NEW
    // user without one, and keeps an existing one - so a toggle cannot
    // silently reset somebody's password).
    api("/api/v1/users", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: u.id, password: "", role: u.role, disabled: !u.disabled }) })
      .then(function(){ loadUsers(); })
      .catch(function(e){ $("uerr").textContent = "change failed: " + e.message; });
  }
}
$("adminpwc").addEventListener("click", closeAdminPasswordReset);
$("adminpwform").addEventListener("submit", function(ev){
  ev.preventDefault();
  var id = adminPasswordTarget;
  var selectedUser = s.users.rows.filter(function(x){ return x.id === id; })[0];
  var p1 = $("adminpw1").value, p2 = $("adminpw2").value;
  var err = $("adminpwerr"), ok = $("adminpwok");
  err.textContent = ""; ok.textContent = "";
  if(!selectedUser){ err.textContent = "User record is no longer available. Close and reopen this dialog."; return; }
  if(p1.length < 8){ err.textContent = "Password must be at least 8 characters."; return; }
  if(p1 !== p2){ err.textContent = "The passwords do not match. Please check both fields."; return; }

  $("adminpwsave").disabled = true;
  $("adminpwc").disabled = true;
  err.textContent = "Saving the new password for " + id + "…";
  fetch("/api/v1/users", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, password: p1, role: selectedUser.role, disabled: selectedUser.disabled })
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      return { ok: r.ok, status: r.status, body: j };
    });
  }).then(function(res){
    if(!res.ok){
      throw new Error((res.body && res.body.error) || ("HTTP " + res.status));
    }
    err.textContent = "";
    //--- Stay in the dialog. A closed native prompt plus a status elsewhere
    //--- was too easy to miss; the outcome now remains directly under the
    //--- password fields until the admin closes this overlay.
    ok.textContent = "SUCCESS: password reset for " + id + ". The user can sign in with the new password.";
    $("adminpw1").value = $("adminpw2").value = "";
    loadUsers();
  }).catch(function(e){
    ok.textContent = "";
    err.textContent = "FAILED: password was not changed for " + id + ". " + e.message;
  }).then(function(){
    $("adminpwsave").disabled = false;
    $("adminpwc").disabled = false;
  });
});
$("usersbody").addEventListener("click", function(ev){
  var btn = ev.target.closest("button");
  if(!btn) return;
  var tr = btn.closest("tr");
  var id = tr ? tr.getAttribute("data-u") : "";
  if(id) userAction(btn.getAttribute("data-act"), id, ev);
});
$("userform").addEventListener("submit", function(ev){
  ev.preventDefault();
  var id = $("uid").value.trim(), pw = $("upass").value, role = $("urole").value;
  var err = $("uerr");
  err.textContent = "";
  if(!id){ err.textContent = "user id is required"; return; }
  if(pw && pw.length < 8){ err.textContent = "password must be at least 8 characters (or leave it empty to keep an existing user's)"; return; }
  fetch("/api/v1/users", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, password: pw, role: role })
  }).then(function(r){
    return r.json().then(function(j){ return { status: r.status, j: j }; });
  }).then(function(res){
    if(res.status === 200){
      $("uid").value = ""; $("upass").value = "";
      loadUsers();
    } else {
      err.textContent = (res.j && res.j.error) || ("HTTP " + res.status);
    }
  }).catch(function(e){
    err.textContent = "request failed: " + e.message;
  });
});
$("ckeycopy").addEventListener("click", function(ev){
  ev.preventDefault();
  var key = $("ckey").textContent;
  var done = function(){ $("ckeycopy").textContent = "(copied)";
                         setTimeout(function(){ $("ckeycopy").textContent = "(copy)"; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(key).then(done, done);
  } else { done(); }
});
//--- Identity is applied through ONE function, from BOTH paths that learn it
//--- (the whoami probe on page load, and the sign-in form). The bug this
//--- replaces: the who pill was only set by the probe, so a FIRST sign-in
//--- through the form left it empty until a reload - and the Users panel's
//--- visibility lived in two places, which is how it drifts.
function setRole(user, role){
  $("who").textContent = user + " · " + role;
  //--- Admin-only chrome. The server is the gate (every /users endpoint 403s
  //--- a non-admin); this just stops a viewer or operator looking at controls
  //--- that cannot work.
  var admin = (role === "admin");
  $("users-sec").classList.toggle("hidden", !admin);
  if(admin) loadUsers();
}
api("/api/v1/whoami").then(function(j){
  $("login").classList.add("hidden");
  setRole(j.user, j.role);
  startDashboard();
}).catch(function(){
  showLogin();
});
$("loginform").addEventListener("submit", function(ev){
  ev.preventDefault();
  $("loginerr").textContent = "";
  fetch("/api/v1/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: $("user").value, password: $("pass").value })
  }).then(function(r){
    if(!r.ok) throw new Error("invalid credentials");
    return r.json();
  }).then(function(j){
    //--- Reload, deliberately - the same thing logout does. Identity is
    //--- cheaper to RE-DERIVE than to reconcile: a fresh page runs whoami
    //--- with the new cookie and every derived state (the who pill, the
    //--- Users panel, the ops chrome) is consistent with it. The old way
    //--- patched the pill in place and still showed the previous user when
    //--- a stale whoami response landed after the login.
    location.reload();
  }).catch(function(){
    $("loginerr").textContent = "sign-in failed - check the id and password";
  });
});
$("logout").addEventListener("click", function(ev){
  ev.preventDefault();
  fetch("/api/v1/logout", { method: "POST" }).then(function(){
    // Drop the in-page state so the next login re-primes it.
    location.reload();
  });
});

// --- change your own password (M9). Any role may; the old password is
// --- required even though the session is already authenticated, so a
// --- borrowed session cannot lock the real owner out.
$("pwdlink").addEventListener("click", function(ev){
  ev.preventDefault();
  $("pwdold").value = $("pwdnew").value = $("pwdnew2").value = "";
  $("pwderr").textContent = ""; $("pwdok").textContent = "";
  $("pwdlg").classList.remove("hidden");
  $("pwdold").focus();
});
$("pwdcancel").addEventListener("click", function(){ $("pwdlg").classList.add("hidden"); });
$("pwdform").addEventListener("submit", function(ev){
  ev.preventDefault();
  var o = $("pwdold").value, n = $("pwdnew").value, n2 = $("pwdnew2").value;
  var err = $("pwderr"), ok = $("pwdok");
  err.textContent = ""; ok.textContent = "";
  if(n.length < 8){ err.textContent = "the new password must be at least 8 characters"; return; }
  if(n !== n2){ err.textContent = "the two new passwords do not match"; return; }
  err.textContent = "saving…";
  fetch("/api/v1/password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ old: o, new: n })
  }).then(function(r){
    return r.json().then(function(j){ return { status: r.status, j: j }; });
  }).then(function(res){
    if(res.j && res.j.ok){
      err.textContent = "";
      ok.textContent = "password changed" +
        (res.j.other_sessions_ended ? " — other sessions were signed out" : "") + ".";
      $("pwdold").value = $("pwdnew").value = $("pwdnew2").value = "";
    } else {
      err.textContent = (res.j && res.j.error) || ("failed (HTTP " + res.status + ")");
    }
  }).catch(function(e){
    err.textContent = "request failed: " + e.message;
  });
});
</script>
