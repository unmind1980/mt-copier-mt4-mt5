# ---------------------------------------------------------------------
# targets.conf - which terminals deploy.sh / compile.sh / status.sh /
#                pilot-setup.sh should act on.
#
# WHY THIS FILE EXISTS
# MetaTrader data folders live in
#     %APPDATA%\MetaQuotes\Terminal\<32-hex-id>\
# and the id is derived from the INSTALL PATH. So two installations of
# the same platform have two separate data folders, and deploying into
# the wrong one looks like it worked - the files are on disk, MetaEditor
# even compiles them, and no running terminal ever reads them.
#
# A PORTABLE install (terminal64.exe /portable) is worse: its data lives
# in the INSTALL FOLDER, and %APPDATA% can still hold an older, stale
# folder for the same installation. List the absolute path to target the
# portable one.
#
# Run ./tools/status.sh --all to see every data folder on this machine,
# its platform, its install path, and when it was last used. The most
# recently used one is almost always the live one.
# ---------------------------------------------------------------------

# --- MT5 at C:\Program Files\MetaTrader 5.  Last used today: LIVE.
D0E8209F77C8CF37AD8BF550E51FF075

# --- MT5 PORTABLE at E:\MetaTrader 5 (launched via Mt5-Portable.bat).
#     Its data lives next to terminal64.exe, NOT in %APPDATA%.
#     Last used today: LIVE.
/e/MetaTrader 5

